<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="maplibre-gl.css">
<style>#m{width:900px;height:500px}</style></head><body><div id="m"></div>
<script type="module">
import * as ml from './maplibre-gl.mjs'
const q = new URLSearchParams(location.search), style = q.get('style') || 'positron'
const allowed = 'https://tiles.openfreemap.org/'
// The host boundary in code (Lead 26f8f7c5): anything else is turned into nothing, no credentials, no referrer.
const transformRequest = q.get('guard') ? url => (url.startsWith(allowed) ? { url, credentials: 'omit', referrerPolicy: 'no-referrer' } : { url: 'data:application/json,{}', credentials: 'omit' }) : undefined
let styleArg = `${allowed}styles/${style}`
if (q.get('evil')) { const s = await (await fetch(styleArg, { credentials: 'omit', referrerPolicy: 'no-referrer' })).json(); s.sources.evil = { type: 'raster', tiles: ['https://example.com/evil/{z}/{x}/{y}.png'], tileSize: 256 }; s.layers.push({ id: 'evil', type: 'raster', source: 'evil' }); s.sprite = 'https://example.org/sprite'; styleArg = s }
const map = new ml.Map({ container: 'm', style: styleArg, center: [-123.12, 49.28], zoom: 12, attributionControl: { compact: true }, transformRequest })
map.on('load', () => { window.loaded = true }); map.on('idle', () => { window.loaded = true })
map.on('error', e => { (window.errs ||= []).push(String(e.error?.message || e).slice(0, 80)) })
window.map = map
</script></body></html>
