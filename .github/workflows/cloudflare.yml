# The Worker (B67), run by the Lead only: `gh workflow run cloudflare.yml --ref <branch> -f action=<action>`.
#   deploy            build the ref and deploy it to the `daythread` Worker (workers.dev until the domain moves)
#   domain-to-worker  daythread.dogrod.com answers from the Worker (its CNAME to Vercel is replaced)
#   domain-to-vercel  the rollback: the Worker lets go of the name and the CNAME to Vercel comes back
#   check-token       what the token may do (status and the Hyperdrive permission names), nothing secret printed
#   timings           the Worker's requests in the last HOURS (default 6) from Workers observability: time, method, path, status, wall ms
# Never runs on PRs, so a fork can't reach the secrets. The Cloudflare token (CLOUDFLARE_API_TOKEN) is Brian's, added by
# him as a repository secret; the app's five values are the same as Vercel's production env, as repository secrets.
name: Cloudflare

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, deploy-preview, domain-to-worker, domain-to-vercel, check-token, timings]
        required: true
      hours:
        type: string
        default: '6'

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

env:
  HOSTNAME: daythread.dogrod.com
  ZONE: dogrod.com
  WORKER: daythread
  # Where the name pointed before the move (DNS only), recorded 2026-10-28.
  VERCEL_TARGET: 50995c4cd509d12f.vercel-dns-017.com

jobs:
  # deploy-preview builds the dispatched ref as a second Worker, daythread-preview (Brian's preview address
  # daythread.dogrod.ca, attached to it in the dashboard). Same database, but its own schema (DAYTHREAD_PG_SCHEMA),
  # so it never reads or writes the production tables; only PREVIEW_INVITES may make an account there.
  deploy:
    if: inputs.action == 'deploy' || inputs.action == 'deploy-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAME: ${{ inputs.action == 'deploy-preview' && 'daythread-preview' || 'daythread' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build (Worker)
        run: npm run build
        env:
          DAYTHREAD_TARGET: cloudflare
      # Supabase's certificate isn't one the Workers runtime accepts, so the Worker reaches the database through
      # Hyperdrive (Cloudflare's pooled connector). Its origin is Supabase's session pooler (5432) on the same host as
      # DATABASE_URL's transaction pooler; caching is off, since a cached read could show a page older than its last
      # save. Made the first time and set again on every deploy (so a changed password or a dashboard edit doesn't
      # linger), then bound as HYPERDRIVE.
      - name: Hyperdrive
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          account=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          if [ -n "${HYPERDRIVE_ID:-}" ]; then
            # Made by Brian in the dashboard (caching off, session pooler); the token may not manage Hyperdrive itself.
            id=$HYPERDRIVE_ID
          else
          configs="https://api.cloudflare.com/client/v4/accounts/$account/hyperdrive/configs"
          body=$(node -e 'const u=new URL(process.env.DATABASE_URL);process.stdout.write(JSON.stringify({name:"daythread",origin:{scheme:"postgres",host:u.hostname,port:5432,database:u.pathname.slice(1)||"postgres",user:decodeURIComponent(u.username),password:decodeURIComponent(u.password)},caching:{disabled:true}}))')
          id=$(api "$configs" | jq -r '[.result[]? | select(.name == "daythread")][0].id // empty')
          if [ -z "$id" ]; then result=$(api -X POST "$configs" -d "$body"); else result=$(api -X PUT "$configs/$id" -d "$body"); fi
          id=$(echo "$result" | jq -r 'if .success then .result.id else empty end')
          [ -n "$id" ] || { echo "Cloudflare refused: $(echo "$result" | jq -c '.errors')"; exit 1; }
          echo "Hyperdrive $id: caching disabled = $(echo "$result" | jq -r '.result.caching.disabled')"
          fi
          jq --arg id "$id" '.hyperdrive = [{binding: "HYPERDRIVE", id: $id}]' .output/server/wrangler.json > "$RUNNER_TEMP/w.json"
          mv "$RUNNER_TEMP/w.json" .output/server/wrangler.json
          echo "bound Hyperdrive $id"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
      - name: Deploy
        run: |
          if [ "$NAME" = daythread-preview ]; then
            npx wrangler@4 deploy -c .output/server/wrangler.json --name "$NAME" --var DAYTHREAD_PG_SCHEMA:daythread_preview
          else
            npx wrangler@4 deploy -c .output/server/wrangler.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # After the deploy, so the Worker exists the first time. Secrets carry over to later deploys; setting them again
      # keeps them equal to the repository's.
      - name: App secrets
        run: |
          [ "$NAME" = daythread-preview ] || unset DAYTHREAD_INVITES
          node -e 'const k=["DATABASE_URL","SUPABASE_URL","SUPABASE_PUBLISHABLE_KEY","OPENROUTER_API_KEY","OPENROUTER_MODEL","DAYTHREAD_INVITES"];process.stdout.write(JSON.stringify(Object.fromEntries(k.filter(n=>process.env[n]).map(n=>[n,process.env[n]]))))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json" -c .output/server/wrangler.json --name "$NAME"
          rm "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          DAYTHREAD_INVITES: ${{ secrets.PREVIEW_INVITES }}

  domain:
    if: inputs.action == 'domain-to-worker' || inputs.action == 'domain-to-vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Move ${{ env.HOSTNAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          ok() { local r; r=$(cat); echo "$r" | jq -e '.success' >/dev/null || { echo "Cloudflare refused: $(echo "$r" | jq -c '.errors')"; exit 1; }; }
          account=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          zone=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id')
          records() { api "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$HOSTNAME"; }
          domains() { api "https://api.cloudflare.com/client/v4/accounts/$account/workers/domains?hostname=$HOSTNAME"; }
          records | ok  # stops here, before any change, if the token can't read the zone's DNS
          echo "before: $(records | jq -c '[.result[] | {type, content, proxied}]') · worker domains $(domains | jq -c '[.result[]? | .service]')"
          if [ "$ACTION" = domain-to-worker ]; then
            api -X PUT "https://api.cloudflare.com/client/v4/accounts/$account/workers/domains" \
              -d "{\"hostname\":\"$HOSTNAME\",\"service\":\"$WORKER\",\"zone_id\":\"$zone\",\"environment\":\"production\",\"override_existing_dns_record\":true}" | ok
          else
            for id in $(domains | jq -r '.result[].id'); do api -X DELETE "https://api.cloudflare.com/client/v4/accounts/$account/workers/domains/$id" >/dev/null; done
            for id in $(records | jq -r '.result[].id'); do api -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$id" | ok; done
            api -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
              -d "{\"type\":\"CNAME\",\"name\":\"$HOSTNAME\",\"content\":\"$VERCEL_TARGET\",\"proxied\":false,\"ttl\":60}" | ok
          fi
          echo "after: $(records | jq -c '[.result[]? | {type, content, proxied}]') · worker domains $(domains | jq -c '[.result[]? | .service]')"

  check-token:
    if: inputs.action == 'check-token'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          echo "verify: $(api https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status}')"
          account=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          echo "accounts: $(api https://api.cloudflare.com/client/v4/accounts | jq -c '[.result[] | .name]')"
          echo "user groups: $(api https://api.cloudflare.com/client/v4/user/tokens/permission_groups | jq -c 'if .success then [.result[] | select(.name | test("yperdrive")) | {name, scopes}] else .errors end')"
          echo "account groups: $(api "https://api.cloudflare.com/client/v4/accounts/$account/tokens/permission_groups" | jq -c 'if .success then [.result[] | select(.name | test("yperdrive")) | {name, scopes}] else .errors end')"
          echo "hyperdrive list: $(api "https://api.cloudflare.com/client/v4/accounts/$account/hyperdrive/configs" | jq -c '{success, errors}')"
          echo "account verify: $(api "https://api.cloudflare.com/client/v4/accounts/$account/tokens/verify" | jq -c '{success, status: .result.status, errors}')"
          zones=$(api "https://api.cloudflare.com/client/v4/zones?name=dogrod.com")
          echo "zones: $(echo "$zones" | jq -c '{success, errors, names: [.result[]? | .name]}')"
          zone=$(echo "$zones" | jq -r '.result[0].id // empty')
          echo "zones (any): $(api "https://api.cloudflare.com/client/v4/zones" | jq -c '{success, errors, names: [.result[]? | .name]}')"
          now=$(($(date +%s) * 1000))
          echo "observability: $(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -X POST "https://api.cloudflare.com/client/v4/accounts/$account/workers/observability/telemetry/query" -d "{\"queryId\":\"check-token\",\"timeframe\":{\"from\":$((now - 3600000)),\"to\":$now},\"view\":\"events\",\"limit\":1,\"parameters\":{\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"daythread\"}]}}" | jq -c '{success, errors}')"
          [ -n "$zone" ] && echo "dns records: $(api "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=daythread.dogrod.com" | jq -c '{success, errors, n: (.result // [] | length)}')"
          echo "worker domains: $(api "https://api.cloudflare.com/client/v4/accounts/$account/workers/domains" | jq -c '{success, errors}')"

  timings:
    if: inputs.action == 'timings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          account=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          now=$(($(date +%s) * 1000))
          body=$(jq -nc --argjson from $((now - ${HOURS:-6} * 3600000)) --argjson to $now '{queryId: "timings", timeframe: {from: $from, to: $to}, view: "events", limit: 2000, parameters: {filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "daythread"}]}}')
          api -X POST "https://api.cloudflare.com/client/v4/accounts/$account/workers/observability/telemetry/query" -d "$body" > "$RUNNER_TEMP/q.json"
          jq -e '.success' "$RUNNER_TEMP/q.json" >/dev/null || { echo "Cloudflare refused: $(jq -c '.errors' "$RUNNER_TEMP/q.json")"; exit 1; }
          # Only time, method, path, status and timings are printed: the raw events also carry the visitor's IP and location.
          jq -r '[.result.events.events[]? | select(."$workers".eventType == "fetch") | ."$workers" as $w
              | [(.timestamp / 1000 | todate), $w.event.request.method, ($w.event.request.url | sub("^https?://[^/]+"; "") | sub("\\?.*"; "")),
                 $w.event.response.status, $w.outcome, $w.wallTimeMs, $w.cpuTimeMs]] | sort | .[] | @tsv' "$RUNNER_TEMP/q.json" \
            | (echo -e "time\tmethod\tpath\tstatus\toutcome\twall_ms\tcpu_ms"; cat)
