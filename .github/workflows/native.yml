# The native app (native/): the Swift packages' tests and the app's, against the shared cases in fixtures/core (made from
# the TypeScript domain by scripts/export-core-fixtures.ts; ci.yml checks they are current). Every step is guarded by the
# folder it needs, so this passes while native/ does not exist yet or holds only some of it.
# If the image's newest Xcode cannot build for iOS 26, only the `swift test` steps can run until the image catches up.
name: Native

on:
  pull_request:
    paths: ['native/**', 'fixtures/**', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['native/**', 'fixtures/**', '.github/workflows/native.yml']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version
      - name: swift test (DaythreadCore)
        run: |
          if [ -d native/Packages/DaythreadCore ]; then cd native/Packages/DaythreadCore && swift test; else echo "native/Packages/DaythreadCore does not exist yet"; fi
      - name: swift test (DaythreadSync)
        run: |
          if [ -d native/Packages/DaythreadSync ]; then cd native/Packages/DaythreadSync && swift test; else echo "native/Packages/DaythreadSync does not exist yet"; fi
      # TEMPORARY (2026-11-26): the Sync test process aborts on the hosted runner ("freed pointer was not the last
      # allocation", in the retry task) and never on a Mac with a newer Xcode. Finds which test does it; removed
      # before merge.
      - name: Which Sync test aborts (temporary)
        if: always()
        run: |
          cd native/Packages/DaythreadSync
          swift build --build-tests > /tmp/build.log 2>&1 || { tail -20 /tmp/build.log; exit 0; }
          swift test list --skip-build > /tmp/tests.txt 2>/dev/null || true
          wc -l /tmp/tests.txt
          for suite in $(sed 's/\/.*//' /tmp/tests.txt | sort -u); do
            bad=0
            for i in 1 2 3 4; do swift test --skip-build --filter "^${suite}/" > /tmp/o.log 2>&1 || bad=$((bad+1)); done
            echo "SUITE $suite: $bad of 4 failed"
            if [ "$bad" -gt 0 ]; then
              grep "^${suite}/" /tmp/tests.txt | sed 's/(.*//' | sort -u | while read -r test; do
                short=${test#*.}
                tbad=0
                for i in 1 2 3 4 5 6; do swift test --skip-build --filter "${short}" > /tmp/t.log 2>&1 || tbad=$((tbad+1)); done
                if [ "$tbad" -gt 0 ]; then echo "  TEST $test: $tbad of 6 failed"; grep -E "freed pointer|Fatal|✘|error:" /tmp/t.log | cut -c1-200 | head -3; fi
              done
            fi
          done
          echo "serial run of everything:"
          sbad=0; for i in 1 2 3; do swift test --skip-build --no-parallel > /tmp/s.log 2>&1 || sbad=$((sbad+1)); done; echo "no-parallel: $sbad of 3 failed"
          exit 0
      # A test process that dies leaves no assertion behind, only this.
      - name: The crash report, when a test process died
        if: failure()
        run: |
          sleep 15
          python3 - <<'PY'
          import glob, json, os
          files = sorted(glob.glob(os.path.expanduser('~/Library/Logs/DiagnosticReports/*.ips')), key=os.path.getmtime)[-2:]
          if not files: print('no crash report found')
          for path in files:
              print('==', path)
              text = open(path, errors='replace').read()
              head, _, body = text.partition('\n')
              try:
                  report = json.loads(body)
              except Exception as error:
                  print('unreadable:', error); print(text[:4000]); continue
              images = report.get('usedImages', [])
              print(report.get('procName'), report.get('exception'), report.get('termination'))
              print('asi:', report.get('asi'))
              for thread in report.get('threads', []):
                  if not thread.get('triggered'): continue
                  for frame in thread.get('frames', [])[:60]:
                      image = images[frame.get('imageIndex', 0)].get('name', '?') if images else '?'
                      print('  ', image, frame.get('symbol', hex(frame.get('imageOffset', 0))), '+', frame.get('symbolLocation', ''))
          PY
      - name: swift test (DaythreadEditor)
        run: |
          if [ -d native/Packages/DaythreadEditor ]; then cd native/Packages/DaythreadEditor && swift test; else echo "native/Packages/DaythreadEditor does not exist yet"; fi
      # The editor's UIKit suite (a row whose kind changes, and the drawn text) runs only on a simulator.
      - name: xcodebuild test (DaythreadEditor, iOS Simulator)
        run: |
          if [ -d native/Packages/DaythreadEditor ]; then
            cd native/Packages/DaythreadEditor
            xcodebuild test -scheme DaythreadEditor -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          else echo "native/Packages/DaythreadEditor does not exist yet"; fi
      # Only the unit tests hosted in the app: the UI tests need the Node servers that native/scripts/ui-test.sh starts.
      # Signed for the simulator without a team (no CODE_SIGNING_ALLOWED=NO), so the host app keeps its entitlements and
      # the Keychain tests can run.
      - name: xcodebuild test (app unit tests, iOS Simulator)
        run: |
          if [ -d native/Daythread.xcodeproj ]; then
            cd native
            xcodebuild test -project Daythread.xcodeproj -scheme Daythread -only-testing:DaythreadTests \
              -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          else echo "native/Daythread.xcodeproj does not exist yet"; fi
      - name: xcodebuild build (Mac Catalyst)
        run: |
          if [ -d native/Daythread.xcodeproj ]; then
            cd native
            xcodebuild build -project Daythread.xcodeproj -scheme Daythread -destination 'platform=macOS,variant=Mac Catalyst' CODE_SIGNING_ALLOWED=NO
          else echo "native/Daythread.xcodeproj does not exist yet"; fi
